[workspace]
members = ["crates/rink-core", "crates/rink-metal", "models/inkling", "crates/rink-cli"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.85"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
half = "2"
foreign-types = "0.5"
memmap2 = "0.9"
metal = "0.32"
objc = "0.2"
safetensors = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
rink-core = { path = "crates/rink-core" }
rink-metal = { path = "crates/rink-metal" }
rink-inkling = { path = "models/inkling" }

[profile.release]
lto = "thin"
codegen-units = 1
